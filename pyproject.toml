[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prosync"
version = "3.2.0"
description = "Intelligent local backup synchronization desktop app with automated SQLite WAL database protection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    { name = "file-bricks Team", email = "support@lukasgeiger.com" }
]
keywords = [
    "backup",
    "cross-platform",
    "data-integrity",
    "database-backup",
    "database-protection",
    "desktop-app",
    "file-bricks",
    "file-sync",
    "local-first",
    "offline-first",
    "open-bricks",
    "privacy-first",
    "pyside6",
    "python",
    "sqlite",
    "sqlite-backup",
    "sync",
    "wal-checkpoint",
    "windows-desktop",
    "zero-egress"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems"
]
dependencies = [
    "PySide6>=6.5.0",
    "paramiko>=3.4.0",
    "pypdf>=4.0.0",
    "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pip-licenses>=4.0.0",
    "ruff>=0.9.0",
    "pyinstaller>=6.10.0",
    "altgraph>=0.17.4"
]

[project.urls]
Homepage = "https://github.com/file-bricks/ProSync"
Documentation = "https://github.com/file-bricks/ProSync/blob/master/USER_GUIDE.md"
Changelog = "https://github.com/file-bricks/ProSync/blob/master/CHANGELOG.md"
Repository = "https://github.com/file-bricks/ProSync.git"
Issues = "https://github.com/file-bricks/ProSync/issues"
Privacy = "https://github.com/file-bricks/ProSync/blob/master/PRIVACY_POLICY.md"
Support = "https://github.com/file-bricks/ProSync/blob/master/SUPPORT.md"
Security = "https://github.com/file-bricks/ProSync/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/file-bricks/ProSync/blob/master/llms.txt"
"Marketing Log" = "https://github.com/file-bricks/ProSync/blob/master/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/file-bricks/ProSync/blob/master/THIRD_PARTY_LICENSES.md"
Notice = "https://github.com/file-bricks/ProSync/blob/master/NOTICE"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".pytest_temp",
    ".ruff_cache",
    ".hypothesis",
    "build",
    "dist",
    "venv",
    ".venv"
]
testpaths = [
    ".",
    "tests"
]
pythonpath = "."
python_files = [
    "test_*.py"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E701", "E702", "E712", "E741", "F401", "F841", "W291", "W293", "F541"]
