name: ProSync Smoke Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest Pillow "tomli>=2.0.0; python_version < '3.11'"

      - name: Compile modules
        run: python -m compileall -q .

      - name: Run smoke tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: python run_tests.py

      - name: Run full pytest suite
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -ra -v
          exit_code=$?
          echo "Full pytest process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Isolate SFTP tests under pytest (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -ra -v test_sftp_target.py
          exit_code=$?
          echo "SFTP-only pytest process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Capture native SFTP SIGABRT backtrace (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        shell: bash
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          gdb --version | head -n 1

          commands_file="$(mktemp)"
          trap 'rm -f "$commands_file"' EXIT
          cat >"$commands_file" <<'GDB'
          set pagination off
          set debuginfod enabled off
          set print frame-arguments none
          handle SIGABRT nostop noprint pass
          tcatch signal SIGABRT
          commands
            silent
            printf "\n--- SIGABRT native backtrace (all threads) ---\n"
            thread apply all bt
            continue
          end
          run
          GDB

          set +e
          gdb --batch --quiet --nx --return-child-result -x "$commands_file" --args python test_sftp_target.py
          exit_code=$?
          echo "GDB-wrapped standalone SFTP process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Check standalone SFTP with Python allocator diagnostics (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "debug"
          PYTHONTRACEMALLOC: "5"
        shell: bash
        run: |
          set +e
          python test_sftp_target.py
          exit_code=$?
          echo "Debug-allocator standalone SFTP process shell exit status: ${exit_code}"
          exit "${exit_code}"
