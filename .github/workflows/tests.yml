name: ProSync Smoke Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest Pillow "tomli>=2.0.0; python_version < '3.11'"

      - name: Compile modules
        run: python -m compileall -q .

      - name: Run smoke tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: python run_tests.py

      - name: Run full pytest suite
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -ra -v
          exit_code=$?
          echo "Full pytest process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Isolate SFTP tests under pytest (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -ra -v test_sftp_target.py
          exit_code=$?
          echo "SFTP-only pytest process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Capture native SFTP SIGABRT backtrace (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        shell: bash
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          gdb --version | head -n 1

          commands_file="$(mktemp)"
          trap 'rm -f "$commands_file"' EXIT
          cat >"$commands_file" <<'GDB'
          set pagination off
          set debuginfod enabled off
          set print frame-arguments none
          handle SIGABRT nostop noprint pass
          tcatch signal SIGABRT
          commands
            silent
            printf "\n--- SIGABRT native backtrace (all threads) ---\n"
            thread apply all bt
            continue
          end
          run
          GDB

          set +e
          gdb --batch --quiet --nx --return-child-result -x "$commands_file" --args python test_sftp_target.py
          exit_code=$?
          echo "GDB-wrapped standalone SFTP process return code: ${exit_code}"
          exit "${exit_code}"

      - name: Check standalone SFTP with Python allocator diagnostics (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: "debug"
          PYTHONTRACEMALLOC: "5"
        shell: bash
        run: |
          set +e
          python test_sftp_target.py
          exit_code=$?
          echo "Debug-allocator standalone SFTP process shell exit status: ${exit_code}"
          exit "${exit_code}"

      - name: Compare SFTP behavior across PySide6 versions (Python 3.10)
        if: ${{ !cancelled() && matrix.python-version == '3.10' }}
        env:
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          import venv

          project_root = pathlib.Path.cwd()
          versions = ("6.11.2", "6.12.0")
          results = []

          def normalized_package(line):
              return re.sub(r"[-_.]+", "-", line.split("==", 1)[0]).lower()

          def is_qt_package(name):
              return name in {"pyside6", "shiboken6"} or name.startswith("pyside6-")

          with tempfile.TemporaryDirectory(prefix="prosync-qt-ab-", dir=os.environ["RUNNER_TEMP"]) as temp_dir:
              root = pathlib.Path(temp_dir)
              envs = {}
              common_constraints = root / "common.constraints.txt"
              common_lines = []
              install_args = ["-r", str(project_root / "requirements.txt"), "pytest", "Pillow", "tomli>=2.0.0; python_version < '3.11'"]

              for index, version in enumerate(versions):
                  env_dir = root / f"venv-{version}"
                  venv.EnvBuilder(with_pip=True).create(env_dir)
                  python = env_dir / "bin" / "python"
                  envs[version] = python
                  qt_constraints = root / f"qt-{version}.constraints.txt"
                  qt_constraints.write_text(
                      "\n".join(f"{name}=={version}" for name in ("PySide6", "PySide6-Addons", "PySide6-Essentials", "shiboken6")) + "\n",
                      encoding="utf-8",
                  )
                  command = [str(python), "-m", "pip", "install"]
                  if index:
                      command.extend(("-c", str(common_constraints)))
                  command.extend(("-c", str(qt_constraints), *install_args))
                  print(f"\nInstalling fresh Python {sys.version.split()[0]} venv for PySide6 {version}", flush=True)
                  install_status = subprocess.run(command, cwd=project_root, check=False).returncode
                  if install_status != 0:
                      print(f"A/B setup failed for PySide6 {version}: pip return code {install_status}", flush=True)
                      sys.exit(install_status)

                  freeze = subprocess.run([str(python), "-m", "pip", "freeze"], capture_output=True, text=True, check=False)
                  if freeze.returncode != 0:
                      print(f"pip freeze failed for PySide6 {version}: {freeze.returncode}", flush=True)
                      sys.exit(freeze.returncode)
                  qt_family = [
                      line for line in freeze.stdout.splitlines()
                      if "==" in line and is_qt_package(normalized_package(line))
                  ]
                  non_qt = [
                      line for line in freeze.stdout.splitlines()
                      if "==" in line and not is_qt_package(normalized_package(line))
                  ]
                  print(f"PySide6 {version} Qt-family packages: {', '.join(sorted(qt_family))}", flush=True)
                  if index == 0:
                      common_lines = non_qt
                      common_constraints.write_text("\n".join(common_lines) + "\n", encoding="utf-8")
                      print(f"Pinned {len(common_lines)} non-Qt packages for the second environment", flush=True)
                  elif sorted(non_qt) != sorted(common_lines):
                      print("Non-Qt dependency versions differ between the fresh environments", flush=True)
                      results.append(("non-Qt dependency parity", 1))
                  else:
                      print("Non-Qt dependency versions identical: True", flush=True)

              env = os.environ.copy()
              env.update(
                  {
                      "PYTHONFAULTHANDLER": "1",
                      "PYTHONIOENCODING": "utf-8",
                      "QT_QPA_PLATFORM": "offscreen",
                  }
              )

              for version, python in envs.items():
                  print(f"\n--- Environment versions: expected PySide6 {version} ---", flush=True)
                  version_code = (
                      "import importlib.metadata, platform, sys; "
                      f"expected={version!r}; "
                      "print('python=' + platform.python_version()); "
                      "[print(name + '=' + importlib.metadata.version(dist)) "
                      "for name, dist in [('PySide6', 'PySide6'), ('shiboken6', 'shiboken6'), "
                      "('pytest', 'pytest'), ('paramiko', 'paramiko'), ('pypdf', 'pypdf'), "
                      "('tzdata', 'tzdata'), ('Pillow', 'Pillow')]]; "
                      "sys.exit(0 if (importlib.metadata.version('PySide6'), importlib.metadata.version('shiboken6')) == (expected, expected) else 1)"
                  )
                  version_status = subprocess.run([str(python), "-c", version_code], cwd=project_root, check=False).returncode
                  if version_status != 0:
                      results.append((f"{version} package-version report", version_status))

              for version, python in envs.items():
                  commands = (
                      ("standalone SFTP", [str(python), "test_sftp_target.py"]),
                      (
                          "pytest SFTP",
                          [
                              str(python),
                              "-m",
                              "pytest",
                              "-ra",
                              "-v",
                              "--basetemp",
                              str(root / f"pytest-temp-{version}"),
                              "test_sftp_target.py",
                          ],
                      ),
                  )
                  for label, command in commands:
                      print(f"\n--- {label}: PySide6 {version} ---", flush=True)
                      process = subprocess.Popen(command, cwd=project_root, env=env)
                      timed_out = False
                      try:
                          status = process.wait(timeout=60)
                      except subprocess.TimeoutExpired:
                          timed_out = True
                          print(f"{label} exceeded 60 seconds; terminating its child process", flush=True)
                          process.kill()
                          status = process.wait()
                      print(f"{label} process return code (PySide6 {version}): {status}", flush=True)
                      results.append((f"{label} PySide6 {version}", status))
                      if timed_out:
                          results.append((f"{label} timeout (PySide6 {version})", 1))

          failures = [(label, status) for label, status in results if status != 0]
          if failures:
              print("\nA/B diagnostic failures:", failures, flush=True)
              sys.exit(1)
          print("\nBoth Qt-version environments and all four SFTP process runs completed successfully.", flush=True)
          PY
